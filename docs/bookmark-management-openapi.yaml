          maxItems: 100
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Slug'
        orphanPolicy:
          type: string
          enum: [reject, delete]

    QuickRecordCreate:
      type: object
      additionalProperties: false
      required: [name, primaryUrl]
      properties:
        name:
          $ref: '#/components/schemas/Name'
        note:
