<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HarborDeck</title>
    <script>
      (() => {
        let skin = null
        try {
          skin = window.localStorage.getItem('harborDeckExtensionTheme')
        } catch {
          // Fall through to the operating-system preference.
        }

        if (skin !== 'midnight' && skin !== 'frost' && skin !== 'ember') {
          skin = window.matchMedia('(prefers-color-scheme: light)').matches ? 'frost' : 'midnight'
        }

        document.documentElement.dataset.skin = skin
        document.documentElement.classList.toggle('dark', skin !== 'frost')
      })()
    </script>
    <style>
      :root {
        color-scheme: dark;
        --loader-page-background: hsl(222 32% 10%);
        --loader-card: hsl(222 28% 14% / 0.94);
        --loader-text: hsl(210 35% 96%);
        --loader-muted: hsl(215 18% 70% / 0.84);
        --loader-border: hsl(220 20% 27% / 0.72);
        --loader-input: hsl(222 30% 16% / 0.9);
        --loader-primary: hsl(183 72% 54%);
        --loader-primary-text: hsl(222 35% 10%);
        --loader-shadow: hsl(222 50% 3% / 0.42);
      }

      :root[data-skin='frost'] {
        color-scheme: light;
        --loader-page-background: hsl(210 36% 97%);
        --loader-card: hsl(210 40% 99% / 0.94);
        --loader-text: hsl(215 28% 17%);
        --loader-muted: hsl(215 14% 42% / 0.76);
        --loader-border: hsl(210 22% 83% / 0.82);
        --loader-input: hsl(210 40% 100% / 0.9);
        --loader-primary: hsl(199 78% 42%);
        --loader-primary-text: hsl(210 40% 98%);
        --loader-shadow: hsl(215 28% 17% / 0.16);
      }

      :root[data-skin='ember'] {
        color-scheme: dark;
        --loader-page-background: hsl(18 24% 10%);
        --loader-card: hsl(19 22% 14% / 0.94);
        --loader-text: hsl(35 40% 96%);
        --loader-muted: hsl(31 18% 70% / 0.84);
        --loader-border: hsl(22 22% 29% / 0.76);
        --loader-input: hsl(19 24% 16% / 0.9);
        --loader-primary: hsl(28 88% 61%);
        --loader-primary-text: hsl(18 30% 10%);
        --loader-shadow: hsl(18 40% 3% / 0.44);
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
        background: var(--loader-page-background);
      }

      #harbordeck-instant-shell {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        background: var(--loader-page-background);
        color: var(--loader-text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      #harbordeck-instant-shell[hidden] {
        display: none;
      }

      .harbordeck-instant-card {
        width: min(100%, 680px);
        box-sizing: border-box;
        padding: 28px;
        border: 1px solid var(--loader-border);
        border-radius: 24px;
        background: var(--loader-card);
        box-shadow: 0 24px 60px var(--loader-shadow);
      }

      .harbordeck-instant-eyebrow {
        margin-bottom: 14px;
        color: var(--loader-primary);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .harbordeck-instant-input {
        width: 100%;
        min-height: 48px;
        box-sizing: border-box;
        padding: 0 16px;
        border: 1px solid var(--loader-border);
        border-radius: 16px;
        outline: none;
        background: var(--loader-input);
        color: var(--loader-text);
        font: inherit;
        font-size: 16px;
        transition: border-color 120ms ease, box-shadow 120ms ease;
      }

      .harbordeck-instant-input:focus {
        border-color: var(--loader-primary);
        box-shadow: 0 0 0 4px color-mix(in srgb, var(--loader-primary) 18%, transparent);
      }

      .harbordeck-instant-status {
        min-height: 20px;
        margin: 12px 0 0;
        color: var(--loader-muted);
        font-size: 13px;
      }

      .harbordeck-instant-action {
        display: none;
        margin-top: 16px;
        min-height: 38px;
        padding: 0 16px;
        border: 0;
        border-radius: 12px;
        background: var(--loader-primary);
        color: var(--loader-primary-text);
        cursor: pointer;
        font: inherit;
        font-weight: 700;
      }

      .harbordeck-instant-shell-paused .harbordeck-instant-action {
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
    </style>
    <script type="module" src="./src/newtab-loader.ts"></script>
  </head>
  <body>
    <section id="harbordeck-instant-shell" aria-label="HarborDeck">
      <form class="harbordeck-instant-card" id="harbordeck-instant-form" autocomplete="off">
        <div class="harbordeck-instant-eyebrow">HarborDeck</div>
        <input
          id="harbordeck-instant-input"
          class="harbordeck-instant-input"
          type="text"
          autofocus
          autocomplete="off"
          spellcheck="false"
          placeholder="正在打开导航页…"
          aria-label="HarborDeck 搜索"
        />
        <p class="harbordeck-instant-status" id="harbordeck-instant-status" aria-live="polite"></p>
        <button class="harbordeck-instant-action" id="harbordeck-instant-action" type="submit">
          打开导航页
        </button>
      </form>
    </section>
    <div id="root"></div>
  </body>
</html>
