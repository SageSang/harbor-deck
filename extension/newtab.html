<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HarborDeck</title>
    <style>
      :root {
        color-scheme: light;
        --boot-bg: #f5f7fa;
        --boot-panel: #fafbfd;
        --boot-text: #202937;
        --boot-field: #fff;
        --boot-border: #d4dce8;
      }
      :root[data-skin='midnight'] {
        color-scheme: dark;
        --boot-bg: #111723;
        --boot-panel: #171e2b;
        --boot-text: #e3edf5;
        --boot-field: #1a2230;
        --boot-border: #323c50;
      }
      :root[data-skin='ember'] {
        color-scheme: dark;
        --boot-bg: #211613;
        --boot-panel: #2b201a;
        --boot-text: #f4ece0;
        --boot-field: #2f221b;
        --boot-border: #49392e;
      }
      body {
        margin: 0;
        background: var(--boot-bg);
        color: var(--boot-text);
        font-family: system-ui, sans-serif;
      }
      #harbordeck-search-boot {
        visibility: hidden;
        position: fixed;
        z-index: 50;
        inset: 0;
        background: var(--boot-bg);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .boot-panel {
        box-sizing: border-box;
        width: min(92vw, 760px);
        padding: 32px;
        border: 1px solid var(--boot-border);
        border-radius: 24px;
        background: var(--boot-panel);
        box-shadow: 0 20px 50px #23324814;
      }
      .boot-panel input {
        box-sizing: border-box;
        width: 100%;
        padding: 18px;
        border: 1px solid var(--boot-border);
        border-radius: 18px;
        font: inherit;
        margin: 16px 0;
        background: var(--boot-field);
        color: var(--boot-text);
      }
      .boot-panel button {
        padding: 10px 16px;
        cursor: pointer;
      }
      .boot-title {
        letter-spacing: 0.2em;
        color: #168bb7;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <form id="harbordeck-search-boot">
      <div class="boot-panel">
        <div class="boot-title">HARBORDECK</div>
        <input
          id="harbordeck-search-boot-input"
          type="text"
          placeholder="搜索词或网址"
          autocomplete="off"
          aria-label="搜索词或网址"
        />
        <p id="boot-status" hidden></p>
        <div id="boot-addresses"></div>
        <button id="boot-retry" type="button">重新检测 / Retry</button
        ><button id="connection-settings" type="button">连接设置 / Connection settings</button>
      </div>
    </form>
    <div id="root"></div>
    <script type="module" src="/src/newtab-loader.ts"></script>
  </body>
</html>
