<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HarborDeck - 智能导航页</title>
    <script id="harbordeck-theme-boot">
      ;(() => {
        const isSkin = (value) => value === 'midnight' || value === 'frost' || value === 'ember'
        const handoffSkin = new URLSearchParams(window.location.search).get('harbordeckSkin')
        let skin = isSkin(handoffSkin) ? handoffSkin : null

        if (!skin) {
          try {
            const storedSkin = window.localStorage.getItem('harborDeckWebTheme')
            skin = isSkin(storedSkin) ? storedSkin : null
          } catch {
            // Fall through to the operating-system preference.
          }
        }

        if (!skin) {
          skin = window.matchMedia('(prefers-color-scheme: light)').matches ? 'frost' : 'midnight'
        }

        document.documentElement.dataset.skin = skin
        document.documentElement.classList.toggle('dark', skin !== 'frost')

        if (isSkin(handoffSkin)) {
          try {
            window.localStorage.setItem('harborDeckWebTheme', handoffSkin)
          } catch {
            // React will still apply the skin for this navigation.
          }
        }
      })()
    </script>
    <style>
      :root {
        color-scheme: dark;
        background: hsl(222 32% 10%);
        --boot-background: hsl(222 32% 10%);
        --boot-foreground: hsl(210 35% 96%);
        --boot-primary: hsl(183 72% 54%);
        --boot-muted: hsl(215 18% 70% / 0.84);
        --boot-border: hsl(220 20% 27% / 0.72);
        --boot-field: hsl(222 28% 14% / 0.94);
        --boot-shadow: hsl(222 50% 3% / 0.42);
      }

      :root[data-skin='frost'] {
        color-scheme: light;
        background: hsl(210 36% 97%);
        --boot-background: hsl(210 36% 97%);
        --boot-foreground: hsl(215 28% 17%);
        --boot-primary: hsl(199 78% 42%);
        --boot-muted: hsl(215 14% 42% / 0.76);
        --boot-border: hsl(210 22% 83% / 0.82);
        --boot-field: hsl(210 40% 99% / 0.94);
        --boot-shadow: hsl(215 28% 17% / 0.16);
      }

      :root[data-skin='ember'] {
        color-scheme: dark;
        background: hsl(18 24% 10%);
        --boot-background: hsl(18 24% 10%);
        --boot-foreground: hsl(35 40% 96%);
        --boot-primary: hsl(28 88% 61%);
        --boot-muted: hsl(31 18% 70% / 0.84);
        --boot-border: hsl(22 22% 29% / 0.76);
        --boot-field: hsl(19 22% 14% / 0.94);
        --boot-shadow: hsl(18 40% 3% / 0.44);
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
        background: var(--boot-background);
      }

      #harbordeck-search-boot {
        position: fixed;
        inset: 0;
        z-index: 999;
        display: grid;
        place-items: center;
        box-sizing: border-box;
        padding: 24px;
        background: var(--boot-background);
        color: var(--boot-foreground);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .harbordeck-search-boot-content {
        width: min(100%, 736px);
      }

      .harbordeck-search-boot-brand {
        margin: 0 0 18px;
        color: var(--boot-primary);
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0;
        text-align: center;
      }

      .harbordeck-search-boot-field {
        position: relative;
        padding: 5px;
        border: 1px solid var(--boot-border);
        border-radius: 19px;
        background: var(--boot-field);
        box-shadow: 0 12px 32px var(--boot-shadow);
      }

      #harbordeck-search-boot-input {
        width: 100%;
        height: 42px;
        box-sizing: border-box;
        padding: 0 16px;
        border: 0;
        border-radius: 14px;
        outline: none;
        background: transparent;
        color: var(--boot-foreground);
        font: inherit;
        font-size: 14px;
        letter-spacing: 0;
      }

      #harbordeck-search-boot-input::placeholder {
        color: var(--boot-muted);
      }

      #harbordeck-search-boot-input:focus {
        box-shadow: 0 0 0 4px color-mix(in srgb, var(--boot-primary) 18%, transparent);
      }

      .harbordeck-search-boot-status {
        min-height: 20px;
        margin: 12px 0 0;
        color: var(--boot-muted);
        font-size: 12px;
        letter-spacing: 0;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <section id="harbordeck-search-boot" aria-label="HarborDeck">
      <div class="harbordeck-search-boot-content">
        <p class="harbordeck-search-boot-brand">HarborDeck</p>
        <div class="harbordeck-search-boot-field">
          <input
            id="harbordeck-search-boot-input"
            type="text"
            autofocus
            autocomplete="off"
            spellcheck="false"
            placeholder="搜索或输入网址"
            aria-label="搜索"
          />
        </div>
        <p class="harbordeck-search-boot-status" aria-live="polite">正在加载导航页…</p>
      </div>
    </section>
    <div id="root"></div>
    <script id="harbordeck-search-boot-script">
      ;(() => {
        const maxLength = 2000
        const input = document.getElementById('harbordeck-search-boot-input')
        if (!(input instanceof HTMLInputElement)) return

        const params = new URLSearchParams(window.location.search)
        const handoffQuery = params.get('harbordeckQuery')?.slice(0, maxLength) ?? ''
        let historyChanged = false
        if (handoffQuery) {
          input.value = handoffQuery
          params.delete('harbordeckQuery')
          historyChanged = true
        }
        if (params.has('harbordeckSkin')) {
          params.delete('harbordeckSkin')
          historyChanged = true
        }
        if (historyChanged) {
          const query = params.toString()
          window.history.replaceState(
            null,
            '',
            `${window.location.pathname}${query ? `?${query}` : ''}${window.location.hash}`
          )
        }

        const state = {
          value: input.value,
          revision: 0,
          pendingSubmit: false,
          released: false,
        }
        window.__harborDeckSearchBoot = state

        const publishValue = () => {
          state.value = input.value.slice(0, maxLength)
          state.revision += 1
          window.dispatchEvent(
            new CustomEvent('harbordeck:search-boot-input', {
              detail: { value: state.value, revision: state.revision },
            })
          )
        }

        input.addEventListener('input', publishValue, { passive: true })
        input.addEventListener('keydown', (event) => {
          if (event.key !== 'Enter' || event.isComposing || !input.value.trim()) return
          event.preventDefault()
          publishValue()
          state.pendingSubmit = true
        })

        input.focus({ preventScroll: true })
        input.setSelectionRange(input.value.length, input.value.length)
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
